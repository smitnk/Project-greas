name: Android Blender GP Core Probe

on:
  workflow_dispatch:
  push:
    branches:
      - native/blender-gp-phase40-cache
    paths:
      - "tools/import_blender_gp.sh"
      - "tools/android_blender_gp_core_probe.sh"
      - ".github/workflows/android-blender-gp-core-probe.yml"
      - "native/blender_gp/**"

jobs:
  android-gp-core-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Import pinned Blender source
        run: |
          bash tools/import_blender_gp.sh

      - name: Run Android Blender GP core cross-build probe
        run: |
          bash tools/android_blender_gp_core_probe.sh
