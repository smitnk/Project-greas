name: Android Blender GP Minimal Buffer Backend

on:
  workflow_dispatch:
  push:
    branches:
      - native/blender-gp-phase40-cache
    paths:
      - "native/blender_gp/android_gpu_backend.*"
      - "native/blender_gp/android_gpu_buffer_backend_test.cpp"
      - "native/blender_gp/android_gpu_backend_runtime_probe.cpp"
      - "native/blender_gp/android_compat/**"
      - "tools/android_blender_gp_minimal_buffer_backend_probe.sh"
      - ".github/workflows/android-blender-gp-minimal-buffer-backend.yml"

jobs:
  android-gp-minimal-buffer-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Install Android NDK 27
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Import pinned Blender source
        run: bash tools/import_blender_gp.sh

      - name: Compile minimum Android GPU buffer closure
        run: bash tools/android_blender_gp_minimal_buffer_backend_probe.sh
