name: Android Blender GP Minimal Probe

on:
  workflow_dispatch:
  push:
    branches:
      - native/blender-gp-phase40-cache
    paths:
      - "tools/import_blender_gp.sh"
      - "tools/android_blender_gp_minimal_probe.sh"
      - ".github/workflows/android-blender-gp-minimal-probe.yml"
      - "native/blender_gp/**"

jobs:
  android-gp-minimal-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Install Android NDK 27
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install minimal host dependencies for Blender DNA generator
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev libpng-dev zlib1g-dev libfreetype6-dev libepoxy-dev libegl1-mesa-dev libgl1-mesa-dev libopenimageio-dev libtiff-dev libjemalloc-dev

      - name: Import pinned Blender source
        run: bash tools/import_blender_gp.sh

      - name: Generate Blender DNA metadata with the pinned source
        run: |
          cmake -S third_party/blender -B build/blender-dna             -C third_party/blender/build_files/cmake/config/blender_lite.cmake             -DCMAKE_BUILD_TYPE=Release             -DWITH_PYTHON=OFF             -DWITH_GHOST=OFF             -DWITH_X11=OFF             -DWITH_BLENDER_THUMBNAILER=OFF             -DWITH_IMAGE_TIFF=OFF             -DWITH_OPENIMAGEIO=OFF             -DWITH_OPENGL_BACKEND=OFF             -DWITH_VULKAN_BACKEND=OFF             -DWITH_GTESTS=OFF
          cmake --build build/blender-dna --target makesdna --parallel 2
          test -f build/blender-dna/source/blender/makesdna/intern/dna_type_offsets.h

      - name: Compile minimal Blender legacy GP sources for Android ARM64
        run: bash tools/android_blender_gp_minimal_probe.sh
