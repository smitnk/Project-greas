name: Project Grease Android Shell
# Continuous native-GP build monitoring trigger.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "feature/project-grease-ui-real-integration"
  push:
    branches:
      - native/blender-gp-phase40-cache
      - "feature/project-grease-ui-real-integration"
      - "feature/project-grease-full-feature-work"
    paths:
      - "android/**"
      - "native/blender_gp/**"
      - "tools/**"
      - ".github/workflows/android-shell.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK 27 with retry
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export ANDROID_SDK_ROOT

          if [ -f "${ANDROID_SDK_ROOT}/ndk/27.0.12077973/source.properties" ]; then
            echo "NDK 27.0.12077973 already installed and verified."
            exit 0
          fi

          SDKMANAGER=""
          for candidate in \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the preinstalled Android SDK."
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
            find "${ANDROID_SDK_ROOT}" -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          for attempt in 1 2 3; do
            echo "Installing NDK 27.0.12077973 (attempt $attempt/3)"
            rm -rf "${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
            set +e
            yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "ndk;27.0.12077973"
            sdkmanager_status=${PIPESTATUS[1]}
            set -e

            if [ "$sdkmanager_status" -eq 0 ] &&
               [ -f "${ANDROID_SDK_ROOT}/ndk/27.0.12077973/source.properties" ]; then
              echo "NDK 27.0.12077973 installed and verified."
              exit 0
            fi

            echo "NDK install attempt failed (sdkmanager exit $sdkmanager_status)."
            rm -rf "${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Import pinned Blender source
        run: bash tools/import_blender_gp.sh

      - name: Generate minimal Blender DNA metadata
        run: bash tools/android_blender_gp_generate_dna.sh

      - name: Run Android unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Android GP application
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify Android GP native link closure
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          export ANDROID_API=26
          test -f "${ANDROID_NDK_ROOT}/source.properties"
          bash tools/android_blender_gp_native_link_probe.sh

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-grease-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
