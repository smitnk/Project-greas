name: Project Grease Android Shell
# Continuous native-GP build monitoring trigger.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "feature/project-grease-ui-real-integration"
  push:
    branches:
      - native/blender-gp-phase40-cache
      - "feature/project-grease-ui-real-integration"
      - "feature/project-grease-full-feature-work"
    paths:
      - "android/**"
      - "native/blender_gp/**"
      - "tools/import_blender_gp.sh"
      - "tools/android_blender_gp_generate_dna.sh"
      - ".github/workflows/android-shell.yml"

jobs:
  android-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK 27 with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing NDK 27.0.12077973 (attempt $attempt/3)"
            rm -rf "${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
            if yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "ndk;27.0.12077973"; then
              test -f "${ANDROID_SDK_ROOT}/ndk/27.0.12077973/source.properties"
              echo "NDK 27.0.12077973 installed and verified."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Import pinned Blender source
        run: bash tools/import_blender_gp.sh

      - name: Generate minimal Blender DNA metadata
        run: bash tools/android_blender_gp_generate_dna.sh

      - name: Build Android GP application
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-grease-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
