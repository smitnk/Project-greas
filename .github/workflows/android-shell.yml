name: Project Grease Android Shell

on:
  workflow_dispatch:
  push:
    branches:
      - native/blender-gp-phase40-cache
    paths:
      - "android/**"
      - ".github/workflows/android-shell.yml"

jobs:
  android-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android shell
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
