name: Project Grease Android Shell
# Continuous native-GP build monitoring trigger.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "feature/project-grease-ui-real-integration"
  push:
    branches:
      - native/blender-gp-phase40-cache
      - "feature/project-grease-ui-real-integration"
      - "feature/project-grease-full-feature-work"
    paths:
      - "android/**"
      - "native/blender_gp/**"
      - "tools/**"
      - ".github/workflows/android-shell.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK 27 with retry
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export ANDROID_SDK_ROOT

          if [ -f "${ANDROID_SDK_ROOT}/ndk/27.0.12077973/source.properties" ]; then
            echo "NDK 27.0.12077973 already installed and verified."
            exit 0
          fi

          SDKMANAGER=""
          for candidate in \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the preinstalled Android SDK."
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
            find "${ANDROID_SDK_ROOT}" -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          for attempt in 1 2 3; do
            echo "Installing NDK 27.0.12077973 (attempt $attempt/3)"
            rm -rf "${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
            set +e
            yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "ndk;27.0.12077973"
            sdkmanager_status=${PIPESTATUS[1]}
            set -e

            if [ "$sdkmanager_status" -eq 0 ] &&
               [ -f "${ANDROID_SDK_ROOT}/ndk/27.0.12077973/source.properties" ]; then
              echo "NDK 27.0.12077973 installed and verified."
              exit 0
            fi

            echo "NDK install attempt failed (sdkmanager exit $sdkmanager_status)."
            rm -rf "${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Import pinned Blender source
        run: bash tools/import_blender_gp.sh

      - name: Verify verbatim Blender regions
        run: python3 tools/verify_blender_verbatim.py

      - name: Run native primitive tests
        run: bash tools/run_native_primitive_tests.sh

      - name: Run native selection tests
        run: bash tools/run_native_select_tests.sh

      - name: Run native eraser tests
        run: bash tools/run_native_eraser_tests.sh

      - name: Run native edit tests
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_edit_tests.sh

      - name: Run native annotation tests
        run: bash tools/run_native_annotation_tests.sh

      - name: Run native Scene-lite tests (Line Art batch 1)
        run: bash tools/run_native_scene_lite_tests.sh

      - name: Run native document-state tests
        run: bash tools/run_native_document_state_tests.sh

      - name: Run native stroke outline tests (miter / round joins)
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_stroke_outline_tests.sh

      - name: Run native vertex-color tests
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_color_tests.sh

      - name: Run native RNG tests
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_rng_tests.sh

      - name: Generate minimal Blender DNA metadata
        run: bash tools/android_blender_gp_generate_dna.sh

      - name: Run native segment select / material / onion tests
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_edit5_tests.sh

      - name: Native fill tool tests (Blender gpencil_fill.c port)
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_fill_tests.sh

      - name: Run native tool session tests (draw input golden, sculpt / vertex / weight paint ports)
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_tool_session_tests.sh

      - name: Cache Blender 3.6.23 (Line Art reference)
        uses: actions/cache@v4
        with:
          path: build/blender-3.6.23
          key: blender-3.6.23-linux-x64

      - name: Generate Blender 3.6.23 Line Art reference output
        run: bash tools/lineart_reference/run_blender_reference.sh build/lineart-reference

      - name: Run native Line Art tests (Blender 3.6.23 Line Art on Scene-lite, lines and strokes compared with Blender)
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
          LINEART_REFERENCE_DIR: build/lineart-reference
        run: bash tools/run_native_lineart_tests.sh

      - name: Install software GLES (Mesa EGL) for the render tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-dev libgles2 libgles-dev libegl-mesa0 libgl1-mesa-dri

      - name: Run native render tests (software GLES2)
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
          PG_REQUIRE_GL: "1"
        run: bash tools/run_native_render_tests.sh

      - name: Run native modifier stack tests
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_modifier_stack_tests.sh

      - name: Run native shader effect tests
        env:
          PG_REQUIRE_BLENDER_SOURCE: "1"
        run: bash tools/run_native_shader_fx_tests.sh

      - name: Run native batch-21 modifier / guide / CurveMapping tests (mod2)
        run: bash tools/run_native_mod2_tests.sh

      - name: Run sweep logcat triage tests
        run: python3 tools/test_logcat_triage.py

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Android GP application
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify Android GP native link closure
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          export ANDROID_API=26
          test -f "${ANDROID_NDK_ROOT}/source.properties"
          bash tools/android_blender_gp_native_link_probe.sh

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Vertex Paint chip is enabled in the built APK
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apk = zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk")
          dex = b"".join(apk.read(n) for n in apk.namelist() if n.startswith("classes") and n.endswith(".dex"))
          assert b"Draw (tint), Blur, Average, Smear (grid) and Replace" in dex, "APK lacks the wired VERTEX_PAINT registry entry"
          assert b"Mode chip disabled; no vertex-color paint path." not in dex, "APK still carries the disabled VERTEX_PAINT entry"
          print("APK carries the enabled Vertex Paint registry entry (mode chip gate: state != NOT_IMPLEMENTED)")
          PY

      - name: Verify the combined batch is in the built APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk = zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk")
          dex = b"".join(apk.read(n) for n in apk.namelist() if n.startswith("classes") and n.endswith(".dex"))
          for text in (b"Export failed", b"A folder with one SVG per frame.", b"Add mask layer", b"In-between easing", b"Mirror copy (X+Y)", b"Select by vertex color", b"Extrude ends", b"Resample (8 px)", b"Thickness x2 by weight"):
              assert text in dex, "APK lacks the UI entry " + text.decode()
          assert b"gpencil_weight_paint.c Draw, Blur, Average and Smear" in dex, "APK lacks the wired WEIGHT_PAINT registry entry"
          assert b"Mode chip disabled; no weight paint path." not in dex, "APK still carries the disabled WEIGHT_PAINT entry"
          assert b"Rename vertex group" in dex, "APK lacks the vertex group UI"
          libs = {n: apk.read(n) for n in apk.namelist() if n.startswith("lib/") and n.endswith(".so")}
          assert libs, "APK has no native library"
          for name, data in libs.items():
              # informational: debug symbols may be stripped by the packager
              print(name, "exports pg_gp_edit2_dispatch symbol:", b"pg_gp_edit2_dispatch" in data)
          print("APK carries the combined-batch UI entries")
          PY

      - name: Verify the shader effects are in the built APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk = zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk")
          dex = b"".join(apk.read(n) for n in apk.namelist() if n.startswith("classes") and n.endswith(".dex"))
          for text in (b"Add effect", b"Wave Distortion", b"Colorize", b"Pixelate", b"Nearest filter", b"Per-layer effect list in the Layers sheet"):
              assert text in dex, "APK lacks the effects UI/registry text " + text.decode()
          assert b"Shader effects need the full DRW pipeline." not in dex, "APK still carries the blocked VISUAL_EFFECTS entry"
          libs = {n: apk.read(n) for n in apk.namelist() if n.startswith("lib/") and n.endswith(".so")}
          assert libs, "APK has no native library"
          for name, data in libs.items():
              print(name, "has Java_..._nativeFxAdd:", b"nativeFxAdd" in data)
          print("APK carries the shader effect UI and the enabled registry entry")
          PY

      - name: Verify the edit3 / UI import batch is in the built APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk = zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk")
          dex = b"".join(apk.read(n) for n in apk.namelist() if n.startswith("classes") and n.endswith(".dex"))
          for text in (b"Insert blank keyframe", b"Clean duplicate frames", b"Select random 50%", b"Vertex color levels x0.8",
                       b"Confirm curve", b"Curve", b"Template", b"Storyboard", b"2D Animation", b"Import SVG", b"Trace image",
                       b"Trace bright areas", b"Annotate", b"Erase notes", b"Clear annotations", b"Include annotations",
                       b"3D reference (Line Art)", b"Import OBJ", b"Clear reference", b"Orthographic scale"):
              assert text in dex, "APK lacks the UI entry " + text.decode()
          for text in (b"Blender curve geometry", b"DIFFERENCE FROM BLENDER", b"GPENCIL_OT_blank_frame_add", b"separate annotation bGPdata"):
              assert text in dex, "APK lacks the registry text " + text.decode()
          assert b"BATCH 3 OF 3" in dex, "APK lacks the Line Art batch 3 registry entry"
          assert b"Generate Line Art strokes" in dex, "APK lacks the Line Art stroke button"
          assert b"Bake Line Art to frames" in dex, "APK lacks the Line Art bake button"
          for text in (b"Fit canvas", b"Delete material", b"Segment", b"Use onion skinning", b"Edit Lines",
                       b"Transparent background", b"Save as failed", b"PNG export failed",
                       b"Dash (3 on / 2 off)", b"Multiply (2 copies)", b"Array (3 copies)", b"Merge by distance",
                       b"Toggle caps (round/flat)", b"Set start point", b"Separate to new layer", b"Copy strokes",
                       b"Paste strokes", b"Move selection here: ", b"Invert sculpt brush", b"Subtract"):
              assert text in dex, "APK lacks UI text %r" % text
          assert b"Line Art preview" in dex, "APK lacks the Line Art preview switch"
          assert b"Needs a minimal scene/object/depsgraph closure that is not established." not in dex, "APK still carries the blocked LINE_ART entry"
          assert b"there is no tool, control-point editing or UI" not in dex, "APK still carries the missing CURVE entry"
          libs = {n: apk.read(n) for n in apk.namelist() if n.startswith("lib/") and n.endswith(".so")}
          assert libs, "APK has no native library"
          for sym in (b"nativeAnnotationCommand", b"nativeAnnotationDump", b"nativeGenerateBlenderPrimitive", b"nativeSceneLiteLoadObj", b"nativeSceneLiteProjectEdges", b"nativeSceneLiteLineArt", b"nativeSceneLiteLineArtStrokes", b"nativeSceneLiteLineArtStrokesEx", b"nativeSceneLiteSetObjectLineArt", b"nativeSceneLiteSetMaterialLineArt", b"nativeSceneLiteAddCollection", b"nativeSceneLiteNames", b"nativeSetFillOptionsEglRenderer", b"nativeRenderCanvasPixelsEglRenderer", b"nativeToolSamples", b"nativeSetSelectionOverlay"):
              owners = [name for name, data in libs.items() if sym in data]
              assert owners, "no native library exports " + sym.decode()
              print(sym.decode(), "in", owners)
          print("APK carries the edit3 / curve / templates / import / trace / annotation UI and JNI entry points")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-grease-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

