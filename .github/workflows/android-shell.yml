name: Project Grease Android Shell

on:
  workflow_dispatch:
  push:
    branches:
      - native/blender-gp-phase40-cache
      - "feature/**"
    paths:
      - "android/**"
      - "native/blender_gp/**"
      - "tools/import_blender_gp.sh"
      - "tools/android_blender_gp_generate_dna.sh"
      - ".github/workflows/android-shell.yml"

jobs:
  android-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import pinned Blender source
        run: bash tools/import_blender_gp.sh

      - name: Generate minimal Blender DNA metadata
        run: bash tools/android_blender_gp_generate_dna.sh

      - name: Build Android GP application
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-grease-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
