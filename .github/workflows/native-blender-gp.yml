name: Native Blender GP Backend

on:
  workflow_dispatch:
  push:
    branches:
      - native/blender-gp-backend
      - native/blender-gp-phase40-cache

jobs:
  native-backend-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Import pinned upstream Blender source
        run: |
          bash tools/import_blender_gp.sh

      - name: Verify required GP source
        run: |
          test -f third_party/blender/source/blender/draw/engines/gpencil/gpencil_engine.c
          test -f third_party/blender/source/blender/blenkernel/BKE_gpencil_legacy.h
          test -f third_party/blender/source/blender/makesdna/DNA_gpencil_legacy_types.h

      - name: Install minimal Blender core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev libpng-dev zlib1g-dev libfreetype6-dev libepoxy-dev libegl1-mesa-dev libgl1-mesa-dev libopenimageio-dev libtiff-dev libjemalloc-dev

      - name: Attach Project Grease backend to Blender build graph
        run: |
          printf '\nadd_subdirectory("%s/native/blender_gp" "%s/build/blender-core/project_grease_gp")\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> third_party/blender/CMakeLists.txt

      - name: Configure minimal Blender core for GP GPU stack
        run: |
          cmake -S third_party/blender -B build/blender-core             -C third_party/blender/build_files/cmake/config/blender_lite.cmake             -DCMAKE_BUILD_TYPE=Release             -DWITH_PYTHON=OFF             -DWITH_GHOST=ON             -DWITH_HEADLESS=ON             -DWITH_X11=OFF             -DWITH_BLENDER_THUMBNAILER=OFF             -DWITH_IMAGE_TIFF=OFF             -DWITH_OPENIMAGEIO=OFF             -DWITH_OPENGL_BACKEND=ON             -DWITH_VULKAN_BACKEND=OFF             -DWITH_GTESTS=OFF

      - name: Inspect generated Blender and Project Grease link recipes
        run: |
          echo "=== Generator ==="
          grep '^CMAKE_GENERATOR:' build/blender-core/CMakeCache.txt || true
          echo "=== Relevant targets ==="
          cmake --build build/blender-core --target help | grep -E 'project_grease_blender_gp|project_grease_gp_link_test|bf_intern_ghost' || true

      - name: Build Blender GPU core and headless GHOST
        run: |
          cmake --build build/blender-core --target bf_gpu bf_intern_ghost --parallel 2

      - name: Link and run Project Grease GP cache test
        run: |
          cmake --build build/blender-core --target project_grease_gp_link_test --parallel 2

          TEST_BIN="$GITHUB_WORKSPACE/build/blender-core/bin/project_grease_gp_link_test"

          echo "=== Final executable ==="
          file "$TEST_BIN"

          echo "=== BKE_gpencil_stroke_close symbol in final executable ==="
          nm -C "$TEST_BIN" | grep -w 'BKE_gpencil_stroke_close' || true

          echo "=== BKE_gpencil_stroke_close disassembly ==="
          objdump -d --disassemble=BKE_gpencil_stroke_close "$TEST_BIN" || true

          echo "=== Archives containing BKE_gpencil_stroke_close ==="
          find "$GITHUB_WORKSPACE/build/blender-core" -name '*.a' -print0 |
            while IFS= read -r -d '' lib; do
              if nm -C "$lib" 2>/dev/null | grep -q 'BKE_gpencil_stroke_close'; then
                echo "FOUND IN: $lib"
                nm -C "$lib" | grep 'BKE_gpencil_stroke_close'
                echo "--- archive index ---"
                nm --print-armap "$lib" 2>/dev/null |
                  grep -B3 -A3 'BKE_gpencil_stroke_close' || true
              fi
            done

          echo "=== Running GP cache test ==="
          "$TEST_BIN"

      - name: Configure Project Grease native boundary
        run: |
          cmake -S native/blender_gp -B build/native-gp

      - name: Compile adapter (standalone API check)
        run: |
          cmake --build build/native-gp --target project_grease_blender_gp
