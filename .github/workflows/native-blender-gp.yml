name: Native Blender GP Backend

on:
  workflow_dispatch:
  push:
    branches:
      - native/blender-gp-backend

jobs:
  native-backend-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4

      - name: Import pinned upstream Blender source
        run: |
          bash tools/import_blender_gp.sh

      - name: Verify required GP source
        run: |
          test -f third_party/blender/source/blender/draw/engines/gpencil/gpencil_engine.c
          test -f third_party/blender/source/blender/blenkernel/BKE_gpencil_legacy.h
          test -f third_party/blender/source/blender/makesdna/DNA_gpencil_legacy_types.h

      - name: Install minimal Blender core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev libpng-dev zlib1g-dev libfreetype6-dev libepoxy-dev

      - name: Configure minimal Blender core for GP GPU stack
        run: |
          cmake -S third_party/blender -B build/blender-core \
            -C third_party/blender/build_files/cmake/config/blender_lite.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_PYTHON=OFF \
            -DWITH_GHOST=OFF \
            -DWITH_BLENDER_THUMBNAILER=OFF \
            -DWITH_IMAGE_TIFF=OFF \
            -DWITH_OPENIMAGEIO=OFF \
            -DWITH_OPENGL_BACKEND=ON \
            -DWITH_VULKAN_BACKEND=OFF \
            -DWITH_GTESTS=OFF

      - name: Build Blender GPU core
        run: |
          cmake --build build/blender-core --target bf_gpu --parallel 2

      - name: Configure Project Grease native boundary
        run: |
          cmake -S native/blender_gp -B build/native-gp

      - name: Build adapter boundary
        run: |
          cmake --build build/native-gp
