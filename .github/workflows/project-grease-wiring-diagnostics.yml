name: Project Grease Android Build

on:
  push:
    branches:
      - project-grease-blender-ui-wiring
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          test -x ./actionlint
          ./actionlint -version

      - name: Run actionlint
        run: ./actionlint -shellcheck=

      - name: Set up Android SDK for Java preflight
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35'

      - name: Fast Java preflight
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_JAR"

          OVERLAY="android/projectgrease/ProjectGreaseOverlayView.java"
          test -f "$OVERLAY"

          rm -rf /tmp/project-grease-java-preflight
          mkdir -p /tmp/project-grease-java-preflight/classes

          javac -Xlint:all             -classpath "$ANDROID_JAR"             -d /tmp/project-grease-java-preflight/classes             "$OVERLAY"

          grep -Fq 'ProjectGreaseOverlayView overlay = new ProjectGreaseOverlayView(this);'             android/apply_project_grease_wiring.sh
          grep -Fq 'cp "$SRC/ProjectGreaseOverlayView.java" "$JAVA_TARGET/"'             android/apply_project_grease_wiring.sh

          echo "[java-preflight] ProjectGreaseOverlayView compiled successfully."
          echo "[java-preflight] Overlay source wiring checks passed."

      - name: Run fast repository static checks
        run: |
          set -euo pipefail
          bash -n android/*.sh
          shellcheck -x android/*.sh
          python3 -m py_compile android/projectgrease/project_grease_startup.py
          NEEDLE=$(printf '\\%s' '${PARTS[@]}')
          if grep -RFn "$NEEDLE" .github/workflows; then
            echo "::error::escaped PARTS array expansion found in workflow"
            exit 1
          fi
          grep -Fq 'tar -C "$BUILD_BASE/lib" -cf - android_arm64' .github/workflows/project-grease-wiring-diagnostics.yml
          grep -Fq 'mapfile -t PARTS' .github/workflows/project-grease-wiring-diagnostics.yml

  build-android:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: /home/runner/.android/sdk
      ANDROID_HOME: /home/runner/.android/sdk
      ANDROID_NDK_VERSION: 28.2.13676358
      BUILD_BASE: ${{ github.workspace }}/.build/blender_build_android
    steps:
      # Blender Android compilation can exceed the default GitHub-hosted runner
      # disk budget. Free disposable preinstalled software before checkout so
      # source, dependency prefixes, and C++ object files have maximum headroom.
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Initial disk-space audit
        run: |
          set -euo pipefail
          echo "[disk] filesystem before checkout/build"
          df -h /
          echo "[disk] top-level runner usage"
          sudo du -xhd1 /usr /opt 2>/dev/null | sort -h | tail -30 || true

      - name: Checkout Project Grease
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-31 platforms;android-34 platforms;android-35 build-tools;35.0.1 ndk;28.2.13676358'

      - name: Verify required Android SDK components
        run: |
          set -euo pipefail
          for pkg in \
            "platforms/android-35/android.jar" \
            "platforms/android-34/android.jar" \
            "platforms/android-31/android.jar" \
            "build-tools/35.0.1/aapt2" \
            "build-tools/35.0.1/d8" \
            "build-tools/35.0.1/apksigner" \
            "ndk/28.2.13676358/ndk-build"; do
            f="$ANDROID_HOME/$pkg"
            if [ ! -e "$f" ]; then
              echo "::error::expected Android SDK/NDK component missing: $f"
              exit 1
            fi
            echo "[sdk-verify] present: $f"
          done
          echo "All required Android SDK/NDK components verified present."

      - name: Normalize Android NDK environment
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          NDK_ROOT="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -d "$NDK_ROOT" || {
            echo "::error::Requested NDK $ANDROID_NDK_VERSION not found at $NDK_ROOT"
            find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null || true
            exit 1
          }
          CLANG="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          test -x "$CLANG" || {
            echo "::error::Requested Android NDK compiler missing: $CLANG"
            exit 1
          }
          # setup-android may leave ANDROID_NDK_ROOT pointing at a preinstalled
          # runner NDK (for example 27.3). The workflow explicitly requires 28.2,
          # so normalize rather than rejecting the stale environment value.
          # export only affects this run step; GITHUB_ENV persists the values
          # into every later step (dependency build, CMake, and APK build).
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "[android-env] SDK      = $SDK_ROOT"
          echo "[android-env] NDK      = $NDK_ROOT"
          echo "[android-env] compiler = $CLANG"
          echo "[android-env] normalized NDK environment will persist via GITHUB_ENV"
          "$CLANG" --version

      - name: Verify NDK env persisted
        run: |
          set -euo pipefail
          EXPECTED_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "EXPECTED_NDK=$EXPECTED_NDK"
          test "$ANDROID_NDK_ROOT" = "$EXPECTED_NDK" || {
            echo "::error::NDK env did not persist from normalize step"
            exit 1
          }
          test "$ANDROID_NDK_HOME" = "$EXPECTED_NDK" || {
            echo "::error::ANDROID_NDK_HOME did not persist from normalize step"
            exit 1
          }
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" || {
            echo "::error::normalized NDK compiler is not executable"
            exit 1
          }

      - name: Install Blender Android host build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-14 g++-14 \
            cmake \
            ninja-build \
            meson \
            pkg-config \
            patchelf \
            git-lfs \
            curl \
            unzip \
            zip
          git lfs install --system
          gcc-14 --version
          cmake --version
          ninja --version
          meson --version
          python3.13 --version
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --list >/dev/null

      - name: Fetch pinned Blender Android source
        run: |
          set -e
          rm -rf vendor/blender_android_upstream
          git clone --depth 1 https://github.com/Wanderson-Magalhaes/blender_for_android.git vendor/blender_android_upstream
          git -C vendor/blender_android_upstream fetch --depth 1 origin 76dc70df95ae32dcd15f3f86abfd82f4c5691140
          git -C vendor/blender_android_upstream checkout --detach 76dc70df95ae32dcd15f3f86abfd82f4c5691140
          git -C vendor/blender_android_upstream submodule sync --recursive
          git -C vendor/blender_android_upstream submodule update --init --recursive

      # Run immediately after the pinned source is available, before the expensive dependency harvest.
      - name: Verify Project Grease wiring early
        run: bash android/verify_project_grease_wiring.sh

      - name: Diagnose ProjectGreaseOverlayView wiring
        run: |
          set -euo pipefail
          APK_MODULE="vendor/blender_android_upstream/build_files/android/apk/app"
          echo "--- searching whole checkout for the file ---"
          find "$GITHUB_WORKSPACE" -iname "ProjectGreaseOverlayView.java" -print
          echo "--- is it inside the actual compiled source set? ---"
          find "$APK_MODULE/src/main/java" -iname "ProjectGreaseOverlayView.java" -print
          echo "--- package declaration, if found anywhere ---"
          find "$GITHUB_WORKSPACE" -iname "ProjectGreaseOverlayView.java" -exec grep -Hn "^package" {} \;
          echo "--- BlenderActivity.java package + imports ---"
          grep -n "^package\|^import" "$APK_MODULE/src/main/java/org/blender/blender/BlenderActivity.java"
          echo "--- Java source count + overlay source count ---"
          find "$APK_MODULE/src/main/java" -type f -name '*.java' | sort | tee /tmp/project-grease-java-sources.txt
          echo "java_source_count=$(wc -l < /tmp/project-grease-java-sources.txt)"
          grep -Fx "$APK_MODULE/src/main/java/org/blender/blender/ProjectGreaseOverlayView.java" /tmp/project-grease-java-sources.txt

      - name: Cache Blender host libraries
        uses: actions/cache@v6
        id: host-lib-cache
        with:
          path: vendor/blender_android_upstream/lib/linux_x64
          key: blender-lib-linux_x64-main-v1
          restore-keys: |
            blender-lib-linux_x64-main-

      - name: Fetch Blender host libraries (lib/linux_x64)
        if: steps.host-lib-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          HOST_LIB="vendor/blender_android_upstream/lib/linux_x64"

          if [ ! -d "$HOST_LIB" ] || [ -z "$(find "$HOST_LIB" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            echo "[host-lib] lib/linux_x64 empty — fetching (update=none submodule, must clone manually)"
            rm -rf "$HOST_LIB"
            git clone --depth 1 --branch main \
              https://projects.blender.org/blender/lib-linux_x64.git \
              "$HOST_LIB"
          else
            echo "[host-lib] lib/linux_x64 already populated, skipping clone"
          fi

          test -d "$HOST_LIB" || { echo "::error::lib/linux_x64 still missing after clone"; exit 1; }
          test -n "$(find "$HOST_LIB" -mindepth 1 -maxdepth 1 -print -quit)" || { echo "::error::lib/linux_x64 still empty after clone"; exit 1; }
          echo "[host-lib] verified: $(find "$HOST_LIB" -mindepth 1 -maxdepth 1 | wc -l) top-level entries"

      - name: Normalize upstream script permissions
        run: |
          set -e
          find vendor/blender_android_upstream/build_files/android -type f -name '*.sh' -exec chmod +x {} \;
          find vendor/blender_android_upstream/build_files/android -type f -name '*.py' -exec chmod +x {} \;
          test -x vendor/blender_android_upstream/build_files/android/build_apk.sh
          test -x vendor/blender_android_upstream/build_files/android/build.py
          test -x vendor/blender_android_upstream/build_files/android/deps/build.sh

      - name: Verify Blender Android source
        run: |
          test -d vendor/blender_android_upstream/source
          test -f vendor/blender_android_upstream/build_files/android/build.py
          test -f vendor/blender_android_upstream/build_files/android/deps/build.sh
          test -f vendor/blender_android_upstream/build_files/android/build_apk.sh
          test -f vendor/blender_android_upstream/intern/ghost/intern/GHOST_SystemAndroid.cc
          test -f vendor/blender_android_upstream/intern/ghost/intern/GHOST_AndroidMain.cc
          test -d vendor/blender_android_upstream/lib/linux_x64
          test -n "$(find vendor/blender_android_upstream/lib/linux_x64 -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Patch dependency download and enforce NDK
        run: |
          set -euo pipefail

          NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -d "$NDK_ROOT"
          NDK_CLANG="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          test -x "$NDK_CLANG"
          echo "Using requested NDK: $NDK_ROOT"
          "$NDK_CLANG" --version

          python3 - vendor/blender_android_upstream/build_files/android/deps/build.sh <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          s = path.read_text()

          old_fetch = '''fetch() {
            local file="$1" url="$2"
            if [ ! -f "$DL_DIR/$file" ]; then
              echo "[deps] fetching $file"
              curl -sL --max-time 300 -o "$DL_DIR/$file" "$url"
            fi
          }'''
          new_fetch = '''fetch() {
            local file="$1" url="$2"
            if [ ! -f "$DL_DIR/$file" ]; then
              echo "[deps] fetching $file"
              if ! curl -fSL --retry 3 --retry-delay 2 --max-time 300 \
                -o "$DL_DIR/$file.part" "$url"; then
                echo "[deps] ERROR: failed to download $url" >&2
                rm -f "$DL_DIR/$file.part"
                exit 1
              fi
              mv "$DL_DIR/$file.part" "$DL_DIR/$file"
            fi
          }'''
          if old_fetch not in s:
              raise SystemExit("expected fetch() block not found")
          s = s.replace(old_fetch, new_fetch, 1)

          old_extract = '''extract() {
            local file="$1" name="$2"
            local dir="$WORK_DIR/$name"
            rm -rf "$dir"
            mkdir -p "$dir"
            tar -xf "$DL_DIR/$file" -C "$dir" --strip-components=1
            echo "$dir"
          }'''
          new_extract = '''extract() {
            local file="$1" name="$2"
            local dir="$WORK_DIR/$name"
            rm -rf "$dir"
            if ! tar -tf "$DL_DIR/$file" >/dev/null 2>&1; then
              echo "[deps] ERROR: $DL_DIR/$file is not a valid tar archive." >&2
              echo "[deps] First 200 bytes of the file for diagnosis:" >&2
              head -c 200 "$DL_DIR/$file" >&2 || true
              echo >&2
              exit 1
            fi
            mkdir -p "$dir"
            if ! tar -xf "$DL_DIR/$file" -C "$dir" --strip-components=1; then
              echo "[deps] ERROR: extraction of $file into $dir failed." >&2
              exit 1
            fi
            echo "$dir"
          }'''
          if old_extract not in s:
              raise SystemExit("expected extract() block not found")
          s = s.replace(old_extract, new_extract, 1)

          old_x264 = '''  fetch "x264-$v.tar.gz" "https://code.videolan.org/videolan/x264/-/archive/$v/x264-$v.tar.gz"'''
          new_x264 = '''  fetch "x264-$v.tar.gz" "https://github.com/mirror/x264/archive/$v/x264-$v.tar.gz"'''
          if old_x264 not in s:
              raise SystemExit("expected x264 VideoLAN fetch line not found")
          s = s.replace(old_x264, new_x264, 1)

          path.write_text(s)
          PY

      - name: Restore Android dependency harvest
        id: android-deps-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/blender_build_android/lib/android_arm64
            .build/blender_build_android/android_deps_build/downloads
          key: ${{ runner.os }}-blender-android-deps-76dc70d-ndk28.2-v2-${{ hashFiles('vendor/blender_android_upstream/build_files/build_environment/cmake/versions.cmake', 'vendor/blender_android_upstream/build_files/android/deps/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-blender-android-deps-76dc70d-ndk28.2-v2-

      - name: Report restored dependency prefix count
        run: |
          set -euo pipefail
          PREFIX="$BUILD_BASE/lib/android_arm64"
          if [ -d "$PREFIX" ]; then
            count="$(find "$PREFIX" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          else
            count=0
          fi
          echo "[deps-cache] cache-hit=${{ steps.android-deps-cache.outputs.cache-hit }}"
          echo "[deps-cache] matched-key=${{ steps.android-deps-cache.outputs.cache-matched-key }}"
          echo "[deps-cache] restored dependency prefixes: $count"

      - name: Purge known-bad cached downloads
        run: |
          set -euo pipefail
          # Run #17 proved the VideoLAN x264 URL can return an anti-bot HTML page.
          # Remove that cached non-archive (and the known-bad openssl download)
          # so the fetch()/mirror patch above is what actually gets used.
          rm -f "$BUILD_BASE/android_deps_build/downloads/openssl-3.5.6.tar.gz"
          rm -f "$BUILD_BASE/android_deps_build/downloads/x264-35fe20d1ba49918ec739a5b068c208ca82f977f7.tar.gz"

      - name: Build Android dependencies
        if: steps.android-deps-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          source vendor/blender_android_upstream/build_files/android/env.sh
          export BUILD_BASE="$BUILD_BASE"
          mkdir -p "$BUILD_BASE"
          bash vendor/blender_android_upstream/build_files/android/deps/build.sh all

      - name: Verify Android dependency prefix
        run: |
          set -e
          test -d "$BUILD_BASE/lib/android_arm64"
          count="$(find "$BUILD_BASE/lib/android_arm64" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "Android dependency prefixes: $count"
          test "$count" -ge 50

      # Save the expensive dependency prefix BEFORE the C++/APK build starts.
      # Run #27 built all 70 dependencies but its later APK failure prevented
      # the normal post-job cache save. This explicit save preserves a complete
      # prefix even when a later Blender compile fails.
      - name: Save Android dependency harvest
        if: steps.android-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/blender_build_android/lib/android_arm64
            .build/blender_build_android/android_deps_build/downloads
          key: ${{ steps.android-deps-cache.outputs.cache-primary-key }}

      - name: Patch Blender Android CI environment wiring
        run: |
          set -euo pipefail
          APK_SCRIPT="vendor/blender_android_upstream/build_files/android/build_apk.sh"
          python3 - "$APK_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          s = path.read_text()
          old = "unset ANDROID_HOME ANDROID_NDK_ROOT ANDROID_NDK_HOME"
          new = """# Preserve CI-provided Android SDK/NDK paths.
          # env.sh already honors ANDROID_HOME and ANDROID_NDK_ROOT; clearing them
          # here would make Linux CI fall back to $HOME/android-sdk and lose the
          # configured NDK/toolchain.
          """
          if old not in s:
              raise SystemExit("expected Android path reset block not found")
          path.write_text(s.replace(old, new, 1))
          PY
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          test "$ANDROID_NDK_ROOT" = "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"

      # Check disk headroom immediately before exporting the dependency backup.
      - name: Disk audit before dependency backup
        run: |
          set -euo pipefail
          echo "[disk] before dependency backup"
          df -h /
          du -sh "$BUILD_BASE/lib/android_arm64"
          command -v zstd
          command -v gh

      # Export the exact compiled dependency prefix to the dedicated backup repository.
      # Stream tar -> zstd -> split so the full archive is never materialized alongside
      # its release chunks. This keeps peak disk usage close to the final chunk footprint.
      - name: Export Android dependency backup
        if: steps.android-deps-cache.outputs.cache-hit != 'true'
        env:
          DEPENDENCIES_REPO_TOKEN: ${{ secrets.DEPENDENCIES_REPO_TOKEN }}
          DEPENDENCIES_REPO: smitnk/Dependencies-andi
        run: |
          set -euo pipefail
          PREFIX="$BUILD_BASE/lib/android_arm64"
          test -d "$PREFIX"
          count="$(find "$PREFIX" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "[deps-backup] dependency prefixes: $count"
          test "$count" -ge 50

          if [ -z "${DEPENDENCIES_REPO_TOKEN:-}" ]; then
            echo "::warning::DEPENDENCIES_REPO_TOKEN is not configured; skipping permanent Dependencies-andi backup."
            echo "[deps-backup] Actions cache remains the active backup."
            exit 0
          fi

          command -v zstd >/dev/null 2>&1 || { echo "::error::zstd is required for dependency backup"; exit 1; }
          command -v gh >/dev/null 2>&1 || { echo "::error::GitHub CLI is required for dependency backup"; exit 1; }

          BACKUP_ROOT="$RUNNER_TEMP/blender-android-dependency-backup"
          MANIFEST="$BACKUP_ROOT/manifest.json"
          CHECKSUMS="$BACKUP_ROOT/SHA256SUMS"
          TAG="blender-76dc70df-android-arm64-ndk-28.2.13676358-v1"
          CHUNK_BYTES=$((1900 * 1024 * 1024))
          PART_PREFIX="$BACKUP_ROOT/lib-android_arm64.part-"
          mkdir -p "$BACKUP_ROOT"

          echo "[deps-backup] streaming compressed dependency archive into release chunks"
          tar -C "$BUILD_BASE/lib" -cf - android_arm64 \
            | zstd -T0 -19 \
            | split -d -a 3 -b "$CHUNK_BYTES" - "$PART_PREFIX"

          mapfile -t PARTS < <(find "$BACKUP_ROOT" -maxdepth 1 -type f -name 'lib-android_arm64.part-*' | sort)
          test "${#PARTS[@]}" -gt 0

          archive_bytes=0
          for part in "${PARTS[@]}"; do
            size="$(stat -c '%s' "$part")"
            test "$size" -lt $((2 * 1024 * 1024 * 1024)) || {
              echo "::error::release chunk exceeds GitHub's 2 GiB asset limit: $part ($size bytes)"
              exit 1
            }
            archive_bytes=$((archive_bytes + size))
          done

          python3 - "$MANIFEST" "$count" "$archive_bytes" "$CHUNK_BYTES" "${PARTS[@]}" <<'PY'
          import json, sys
          from pathlib import Path

          out = Path(sys.argv[1])
          count = int(sys.argv[2])
          archive_bytes = int(sys.argv[3])
          chunk_bytes = int(sys.argv[4])
          parts = sys.argv[5:]

          out.write_text(json.dumps({
              "repository": "smitnk/Project-greas",
              "dependency_repository": "smitnk/Dependencies-andi",
              "blender_commit": "76dc70df95ae32dcd15f3f86abfd82f4c5691140",
              "ndk": "28.2.13676358",
              "abi": "arm64-v8a",
              "dependency_prefix": "lib/android_arm64",
              "dependency_prefix_count": count,
              "android_min_api": 31,
              "android_compile_api": 35,
              "archive": "lib-android_arm64.tar.zst",
              "archive_size_bytes": archive_bytes,
              "chunk_size_bytes": chunk_bytes,
              "chunks": [Path(p).name for p in parts],
              "restore": "cat lib-android_arm64.part-* > lib-android_arm64.tar.zst"
          }, indent=2) + "\n")

          sha256sum "${PARTS[@]}" > "$CHECKSUMS"
          sha256sum "$MANIFEST" >> "$CHECKSUMS"
          ls -lh "${PARTS[@]}" "$MANIFEST" "$CHECKSUMS"

          echo "$DEPENDENCIES_REPO_TOKEN" | gh auth login --with-token
          gh auth status

          if gh release view "$TAG" --repo "$DEPENDENCIES_REPO" >/dev/null 2>&1; then
            echo "[deps-backup] release $TAG already exists; replacing its assets"
          else
            gh release create "$TAG" \
              --repo "$DEPENDENCIES_REPO" \
              --title "Blender Android dependencies — 76dc70df / NDK 28.2" \
              --notes "Compiled Android arm64 dependency prefix for Project Grease. Blender commit: 76dc70df95ae32dcd15f3f86abfd82f4c5691140. NDK: 28.2.13676358. ABI: arm64-v8a."
          fi

          gh release upload "$TAG" "${PARTS[@]}" "$MANIFEST" "$CHECKSUMS" \
            --repo "$DEPENDENCIES_REPO" --clobber
          echo "[deps-backup] permanent backup published to $DEPENDENCIES_REPO release $TAG"

      # Dependency compilation has already produced the Android prefix used by
      # Blender. Remove only disposable dependency downloads before the much
      # larger Blender C++ compilation. Keep lib/android_arm64 intact.
      - name: Reclaim dependency downloads
        run: |
          set -euo pipefail
          echo "[disk] before dependency-download cleanup"
          df -h "$GITHUB_WORKSPACE"
          if [ -d "$BUILD_BASE/android_deps_build/downloads" ]; then
            echo "[disk] removing disposable dependency download archives"
            rm -rf "$BUILD_BASE/android_deps_build/downloads"
          fi
          echo "[disk] after dependency-download cleanup"
          df -h "$GITHUB_WORKSPACE"
          echo "[disk] largest project directories"
          du -xhd2 "$GITHUB_WORKSPACE" 2>/dev/null | sort -h | tail -40 || true

      - name: Build Blender Android lite APK
        run: |
          set -euo pipefail
          echo "[build-apk] ANDROID_HOME=$ANDROID_HOME"
          echo "[build-apk] ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          test "$ANDROID_NDK_ROOT" = "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" --version
          APK_SCRIPT="vendor/blender_android_upstream/build_files/android/build_apk.sh"
          chmod +x "$APK_SCRIPT"
          if [ ! -x "$APK_SCRIPT" ]; then
            echo "::error::build_apk.sh is not executable after chmod — check filesystem/mount options"
            exit 1
          fi
          bash -lc "${{ github.workspace }}/$APK_SCRIPT" lite

      - name: Find APKs
        run: |
          set -e
          find "$BUILD_BASE" -type f \( -name '*.apk' -o -name '*.aab' \) -print | tee apk-files.txt
          test -s apk-files.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: project-grease-android-apk
          path: |
            /home/runner/work/Project-greas/.build/blender_build_android/**/*.apk
            /home/runner/work/Project-greas/.build/blender_build_android/**/*.aab
            apk-files.txt
          if-no-files-found: error
