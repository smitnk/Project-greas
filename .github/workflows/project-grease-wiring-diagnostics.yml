name: Project Grease Android Build

on:
  push:
    branches:
      - project-grease-blender-ui-wiring
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Project Grease
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify wiring
        run: bash android/verify_project_grease_wiring.sh

      - name: Build Blender Android lite APK
        run: bash android/build_project_grease_lite.sh lite

      - name: Find APKs
        run: |
          set -e
          find vendor/blender_android_upstream -type f \( -name '*.apk' -o -name '*.aab' \) -print | tee apk-files.txt
          test -s apk-files.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-grease-android-apk
          path: |
            vendor/blender_android_upstream/**/*.apk
            vendor/blender_android_upstream/**/*.aab
            apk-files.txt
          if-no-files-found: error
